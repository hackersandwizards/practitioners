# A practitioner's pull request skips every local hook (.githooks/README.md), so it gets the
# bio gate and a secret scan here. No deploy, no secrets.
name: pull-request

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Reads packageManager from package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The CLI, not gitleaks-action, which needs a license secret for organization repositories.
      - name: gitleaks over the pull request's commits
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          # The default rules, and no allowlist the pull request itself could add.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..$HEAD" --redact --no-banner \
            --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP" --ignore-gitleaks-allow
